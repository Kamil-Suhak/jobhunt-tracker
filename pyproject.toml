[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jobhunt-tracker"
version = "0.1.0"
description = "A sleek command-line job application tracker built with Typer, Rich, SQLite3, and Plotext."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Kamil" }
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "plotext>=5.2.8",
]

[project.scripts]
jht = "jobhunt_tracker.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
